<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tools - Educational Utilities & Calculations</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-sec: #9ca3af;
            --border: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .logo-text h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text p {
            margin: 2px 0 0;
            font-size: 0.75rem;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-sec);
        }

        .main-wrapper {
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .cat-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sec);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-btn:hover, .cat-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 24px -6px rgba(59, 130, 246, 0.25);
        }

        .game-thumb {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .game-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .game-info h3 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-info p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-sec);
        }

        /* Fullscreen Player View */
        #player-view {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 20px 30px;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .player-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .back-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: var(--border);
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 700px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 24px;
            background-color: var(--card-bg);
            color: var(--text-sec);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }
    </style>
</head>

        function renderModules(list) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = "";
            list.forEach(m => {
                grid.innerHTML += `
                    <div class="game-card" onclick="launchModule('${m.url}', '${m.title}')">
                        <div class="game-thumb">${m.icon}</div>
                        <div class="game-info">
                            <h3>${m.title}</h3>
                            <p>${m.desc}</p>
                        </div>
                    </div>
                `;
            });
        }

        function launchModule(url, title) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'flex';
            document.getElementById('activeTitle').innerText = title;
            document.getElementById('mainFrame').src = url;
        }

        function goHome() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('mainFrame').src = '';
        }

        function filterModules() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let matches = modules.filter(m => m.title.toLowerCase().includes(query) || m.desc.toLowerCase().includes(query));
            renderModules(matches);
        }

        function switchCat(category) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (category === 'all') {
                renderModules(modules);
            } else {
                renderModules(modules.filter(m => m.cat === category));
            }
        }

        // Boot initial render
        renderModules(modules);
    </script>
</body>
</html>
